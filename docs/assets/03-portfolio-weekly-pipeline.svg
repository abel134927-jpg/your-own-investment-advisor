  <title id="title">Portfolio Weekly：把產業觀點放進真實持倉與風險上限</title><desc id="desc">資料帳本底座、研究、顧問判斷、IPS 護欄、紅隊、定稿交付與確認記帳流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf1f8"/></linearGradient><marker id="ba" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#42a5ff"/></marker><marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ffb74d"/></marker><marker id="ra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff6363"/></marker><marker id="ga" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#51d88a"/></marker><style>.t{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#14243a}.sub{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:23px;fill:#53657c}.tag{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:15px;font-weight:700;letter-spacing:1.3px}.h{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:23px;font-weight:700;fill:#14243a}.body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:16px;fill:#26384f}.small{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:14px;fill:#5b6f88}.card{fill:#ffffff;stroke:#c9d7e6;stroke-width:2}.label{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:13px;font-weight:700}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><path d="M0 155H1600M0 914H1600" stroke="#16304e" stroke-width="2"/><text x="55" y="70" class="tag" fill="#42a5ff">PORTFOLIO INTELLIGENCE / 03</text><text x="55" y="114" class="t" font-size="37" font-weight="700">Portfolio Weekly：把產業觀點放進真實持倉與風險上限</text><text x="55" y="147" class="sub">不是問「哪檔股票好」；而是問「在既有曝險、政策與風險預算下，現在該做什麼？」</text>
  <!-- foundation -->
  <g transform="translate(55 200)"><rect class="card" width="285" height="540" rx="16"/><rect width="285" height="8" rx="4" fill="#42a5ff"/><text x="22" y="42" class="tag" fill="#72baff">資料與帳本底座</text><text x="22" y="76" class="h">真實曝險的唯一來源</text><path d="M22 98H263" stroke="#284563"/><text x="22" y="132" class="body">市場／宏觀</text><text x="22" y="157" class="small">行情、估值、VIX、利率、美元</text><text x="22" y="180" class="small">CPI、失業、南向、CFTC、Polymarket</text><text x="22" y="222" class="body">持倉真相</text><text x="22" y="247" class="small">transactions.csv（append-only）</text><text x="22" y="270" class="small">重建 holdings.json、價格、成本、P&amp;L</text><text x="22" y="312" class="body">量化佐證</text><text x="22" y="337" class="small">外部量化排名／回測（自選整合）</text><text x="22" y="360" class="small">ETF Look-through 公司級重疊曝險</text><rect x="22" y="402" width="241" height="86" rx="9" fill="#092d50"/><text x="38" y="430" class="label" fill="#83c8ff">重要原則</text><text x="38" y="454" class="small">量化訊號是佐證與反證，</text><text x="38" y="477" class="small">不能單獨變成買賣指令。</text></g>
  <path d="M342 460H382" stroke="#42a5ff" stroke-width="4" marker-end="url(#ba)"/><text x="344" y="443" class="label" fill="#72baff">資料流</text>
  <!-- A -->
  <g transform="translate(390 200)"><rect class="card" width="270" height="290" rx="16"/><rect width="270" height="8" rx="4" fill="#42a5ff"/><text x="20" y="42" class="tag" fill="#72baff">A｜研究員</text><text x="20" y="75" class="h">證據包</text><path d="M20 96H250" stroke="#284563"/><text x="20" y="126" class="body">刷新行情、宏觀、事件日曆</text><text x="20" y="153" class="body">驗證帳本、重建持倉</text><text x="20" y="180" class="body">估值、ETF 集中度與穿透</text><text x="20" y="207" class="body">尋找核心論點的反向證據</text><rect x="20" y="232" width="230" height="37" rx="8" fill="#092d50"/><text x="32" y="256" class="label" fill="#83c8ff">輸出｜Portfolio Wrapper Packet</text></g>
  <!-- B -->
  <g transform="translate(700 200)"><rect class="card" width="270" height="290" rx="16"/><rect width="270" height="8" rx="4" fill="#ffb74d"/><text x="20" y="42" class="tag" fill="#ffca75">B｜主筆</text><text x="20" y="75" class="h">顧問草稿</text><path d="M20 96H250" stroke="#284563"/><text x="20" y="126" class="body">檢查建議、權重與 drift</text><text x="20" y="153" class="body">持倉 Thesis：強／未變／弱／破</text><text x="20" y="180" class="body">集中度、事件與退出條件</text><text x="20" y="207" class="body">AI Strategy 的部署依據</text><rect x="20" y="232" width="230" height="37" rx="8" fill="#443011"/><text x="32" y="256" class="label" fill="#ffd083">輸出｜不交付的顧問草稿</text></g>
  <!-- C -->
  <g transform="translate(1010 200)"><rect class="card" width="270" height="290" rx="16"/><rect width="270" height="8" rx="4" fill="#ff6363"/><text x="20" y="42" class="tag" fill="#ffadad">C｜紅隊</text><text x="20" y="75" class="h">投資組合紅隊</text><path d="M20 96H250" stroke="#284563"/><text x="20" y="126" class="body">每項建議的最強 bear case</text><text x="20" y="153" class="body">回撤與節奏是否過度樂觀？</text><text x="20" y="180" class="body">ETF／直接持股是否集中？</text><text x="20" y="207" class="body">利率、美元是否反駁部署？</text><rect x="20" y="232" width="230" height="37" rx="8" fill="#481923"/><text x="32" y="256" class="label" fill="#ffb0b4">輸出｜同意／保留／反對</text></g>
  <!-- D -->
  <g transform="translate(1320 200)"><rect class="card" width="225" height="290" rx="16"/><rect width="225" height="8" rx="4" fill="#51d88a"/><text x="20" y="42" class="tag" fill="#75e3a3">D｜主筆</text><text x="20" y="75" class="h">定稿交付</text><path d="M20 96H205" stroke="#284563"/><text x="20" y="126" class="body">採納／反駁紅隊</text><text x="20" y="153" class="body">final decision 與風險</text><text x="20" y="180" class="body">更新歷史與長期 Wiki</text><text x="20" y="207" class="body">版面 QA 後生成 PDF</text><rect x="20" y="232" width="185" height="37" rx="8" fill="#123b2a"/><text x="32" y="256" class="label" fill="#84e8ad">短文 + PDF</text></g>
  <path d="M662 345H692" stroke="#ffb74d" stroke-width="4" marker-end="url(#aa)"/><path d="M972 345H1002" stroke="#ff6363" stroke-width="4" marker-end="url(#ra)"/><path d="M1282 345H1312" stroke="#51d88a" stroke-width="4" marker-end="url(#ga)"/>
  <!-- IPS -->
  <g transform="translate(675 530)"><rect width="630" height="135" rx="14" fill="#382913" stroke="#ffb74d" stroke-width="2"/><text x="24" y="34" class="tag" fill="#ffcf7f">IPS 風險護欄｜判斷必須在政策內</text><text x="24" y="63" class="small">Core + Cash／長期 ETF：使用者自主；系統負責 thesis 與風險看門狗</text><text x="24" y="88" class="small">AI Strategy ≤ 總資產 30%｜「本週無動作」是合格輸出</text><text x="24" y="113" class="small">新建議必須具備：環境依據、最大回撤、退出條件、最強 bear case</text></g>
  <path d="M835 492V520" stroke="#ffb74d" stroke-width="3" marker-end="url(#aa)"/><path d="M1145 520V492" stroke="#ff6363" stroke-width="3" marker-end="url(#ra)"/>
  <!-- feed and ledger -->
  <g transform="translate(55 785)"><rect width="800" height="76" rx="13" fill="#0a1a2c" stroke="#274361" stroke-width="2"/><text x="23" y="30" class="tag" fill="#42a5ff">產業觀點輸入</text><rect x="23" y="42" width="185" height="24" rx="5" fill="#0b3158"/><text x="36" y="60" class="label" fill="#83c8ff">AI 週報</text><path d="M214 54H294" stroke="#42a5ff" stroke-width="3" marker-end="url(#ba)"/><rect x="305" y="42" width="205" height="24" rx="5" fill="#0b3158"/><text x="320" y="60" class="label" fill="#83c8ff">AI Strategy 候選</text><path d="M516 54H596" stroke="#42a5ff" stroke-width="3" marker-end="url(#ba)"/><rect x="607" y="42" width="170" height="24" rx="5" fill="#0b3158"/><text x="621" y="60" class="label" fill="#83c8ff">Portfolio Weekly</text></g>
  <g transform="translate(885 735)"><rect width="660" height="126" rx="13" fill="#0c1c31" stroke="#51d88a" stroke-width="2"/><text x="23" y="31" class="tag" fill="#75e3a3">交易記帳，不是自動下單</text><text x="23" y="57" class="small">使用者自行下單 → 以自然語言回報 → 系統列出結構化確認表</text><text x="23" y="82" class="small">→ 使用者明確說「確認寫入」→ 才 append transactions.csv 並重建 holdings</text><text x="23" y="107" class="label" fill="#ffb0b4">任何一步沒有明確確認：不寫帳、不下單。</text></g>
  <text x="55" y="962" class="small">研究與教育用途｜不構成投資建議｜系統不自動下單｜資料缺口會明確標示</text>
</svg>
