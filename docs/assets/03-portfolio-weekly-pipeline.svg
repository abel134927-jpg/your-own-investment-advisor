    text[fill="#83c8ff"]{fill:#176fae} text[fill="#ffd083"],text[fill="#ffca75"],text[fill="#ffcf7f"]{fill:#a66300} text[fill="#ffb0b4"],text[fill="#ffadad"]{fill:#b33142} text[fill="#84e8ad"],text[fill="#75e3a3"]{fill:#238e55}
