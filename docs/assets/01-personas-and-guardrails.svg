<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">三種人格，一套可追溯的投資研究系統</title>
  <desc id="desc">研究員、主筆與紅隊的分工，以及不自動下單、帳本確認與成功靜默護欄。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf1f8"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#42a5ff"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ffb74d"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff6363"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#51d88a"/></marker>
    <style>
      .t{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#14243a}.sub{font-size:25px;fill:#53657c}.eyebrow{font-size:17px;font-weight:700;letter-spacing:2px}.h{font-size:32px;font-weight:700}.role{font-size:19px;font-weight:700}.body{font-size:18px;fill:#26384f}.small{font-size:16px;fill:#5b6f88}.tiny{font-size:14px;fill:#71839a}.card{fill:#ffffff;stroke:#c9d7e6;stroke-width:2}.divider{stroke:#d5dee8;stroke-width:1}.chip{font-size:15px;font-weight:700}.guardH{font-size:23px;font-weight:700}.guardB{font-size:17px;fill:#334862}
    </style>
  </defs>
  <style>
    rect[fill="#092947"],rect[fill="#0b3158"]{fill:#e6f3ff} rect[fill="#3e2a10"],rect[fill="#463011"]{fill:#fff2dc} rect[fill="#431a25"],rect[fill="#491a23"]{fill:#ffeaec} rect[fill="#123b2a"]{fill:#e7f8ee}
    text[fill="#7ac4ff"]{fill:#176fae} text[fill="#ffcf7e"]{fill:#a66300} text[fill="#ffafb2"]{fill:#b33142}
  </style>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M0 155H1600M0 845H1600" stroke="#ccd9e7" stroke-width="2"/>
  <text x="80" y="76" class="eyebrow" fill="#42a5ff">MULTI-AGENT RESEARCH SYSTEM / 01</text>
  <text x="80" y="119" class="t" font-size="39" font-weight="700">三種人格，一套可追溯的投資研究系統</text>
  <text x="80" y="151" class="sub">研究不等於判斷；判斷必須接受反方壓力測試；交易永遠由使用者確認。</text>

  <!-- Persona cards -->
  <g transform="translate(80 205)">
    <rect class="card" width="450" height="355" rx="16"/><rect width="450" height="7" rx="4" fill="#42a5ff"/>
    <circle cx="48" cy="53" r="25" fill="#0d3157" stroke="#42a5ff" stroke-width="2"/><circle cx="44" cy="49" r="9" fill="none" stroke="#77bdff" stroke-width="3"/><path d="M51 56l9 9M33 72h31" stroke="#77bdff" stroke-width="3" stroke-linecap="round"/>
    <text x="88" y="50" class="h">研究員</text><text x="88" y="78" class="role" fill="#42a5ff">證據層｜找資料、驗證來源、結構化整理</text>
    <line x1="28" y1="102" x2="422" y2="102" class="divider"/>
    <text x="28" y="136" class="body">一手資料優先：財報、法說會、IR、監管申報</text>
    <text x="28" y="168" class="body">資料包：價格、估值、宏觀、事件與來源品質</text>
    <text x="28" y="200" class="body">主動搜尋反向證據；資料不足明確標示 degraded</text>
    <rect x="28" y="230" width="394" height="43" rx="8" fill="#092947"/><text x="42" y="258" class="chip" fill="#7ac4ff">Data Pack · 一手研究 · Blog/RSS · ArXiv · Polymarket</text>
    <text x="28" y="310" class="small" fill="#ffadad">禁止：不給買賣建議／不改交易帳本／不把短線訊號當結論</text>
    <text x="28" y="335" class="tiny">可用能力不代表每一輪都會呼叫所有工具</text>
  </g>
  <g transform="translate(575 205)">
    <rect class="card" width="450" height="355" rx="16"/><rect width="450" height="7" rx="4" fill="#ffb74d"/>
    <circle cx="48" cy="53" r="25" fill="#4a3211" stroke="#ffb74d" stroke-width="2"/><path d="M35 62l12-22 8 11 9-15M35 70h27M58 70l9-9" fill="none" stroke="#ffd48e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="50" class="h">主筆</text><text x="88" y="78" class="role" fill="#ffb74d">判斷與整合層｜有條件、可推翻的結論</text>
    <line x1="28" y1="102" x2="422" y2="102" class="divider"/>
    <text x="28" y="136" class="body">第一性原理：拆回成本、供需與現金流</text>
    <text x="28" y="168" class="body">先寫結論，再列關鍵假設與推翻條件</text>
    <text x="28" y="200" class="body">股價波動不等於 Thesis 改變；納入風險上限</text>
    <rect x="28" y="230" width="394" height="43" rx="8" fill="#3e2a10"/><text x="42" y="258" class="chip" fill="#ffcf7e">初稿 → 回應紅隊 → 終稿／Dashboard PDF／短文</text>
    <text x="28" y="310" class="small" fill="#ffadad">禁止：不跳過紅隊／不自動下單／不包裝資料缺口</text>
  </g>
  <g transform="translate(1070 205)">
    <rect class="card" width="450" height="355" rx="16"/><rect width="450" height="7" rx="4" fill="#ff6363"/>
    <circle cx="48" cy="53" r="25" fill="#4c1821" stroke="#ff6363" stroke-width="2"/><path d="M48 32l18 7v13c0 12-8 21-18 25-10-4-18-13-18-25V39zM38 55l20-8M45 64l14-18" fill="none" stroke="#ffafb2" stroke-width="3" stroke-linejoin="round"/>
    <text x="88" y="50" class="h">紅隊</text><text x="88" y="78" class="role" fill="#ff6363">空頭紅隊｜反方壓力測試</text>
    <line x1="28" y1="102" x2="422" y2="102" class="divider"/>
    <text x="28" y="136" class="body">先問：如果這個判斷會錯，會錯在哪裡？</text>
    <text x="28" y="168" class="body">懷疑共識、估值過熱、資本配置與過度自信</text>
    <text x="28" y="200" class="body">要求具體證據；先獨立寫空頭觀點再讀草稿</text>
    <rect x="28" y="230" width="394" height="43" rx="8" fill="#431a25"/><text x="42" y="258" class="chip" fill="#ffafb2">同意／有保留／反對 ＋ 最強反論 ＋ 資料品質評語</text>
    <text x="28" y="310" class="small" fill="#ffadad">規則：不接受「新聞很熱」作為判斷依據</text>
  </g>

  <!-- Decision river -->
  <text x="80" y="611" class="eyebrow" fill="#aab9ce">可追溯的決策流</text>
  <g transform="translate(80 635)">
    <rect width="350" height="68" rx="12" fill="#0b3158" stroke="#42a5ff" stroke-width="2"/><text x="27" y="42" class="t" font-size="23" font-weight="700">證據</text><text x="112" y="42" class="small">資料包與來源品質</text>
    <line x1="360" y1="34" x2="415" y2="34" stroke="#ffb74d" stroke-width="4" marker-end="url(#arrowAmber)"/>
    <rect x="430" width="350" height="68" rx="12" fill="#463011" stroke="#ffb74d" stroke-width="2"/><text x="457" y="42" class="t" font-size="23" font-weight="700">初步判斷</text><text x="590" y="42" class="small">假設與退出條件</text>
    <line x1="790" y1="34" x2="845" y2="34" stroke="#ff6363" stroke-width="4" marker-end="url(#arrowRed)"/>
    <rect x="860" width="350" height="68" rx="12" fill="#491a23" stroke="#ff6363" stroke-width="2"/><text x="887" y="42" class="t" font-size="23" font-weight="700">反方壓力測試</text><text x="1080" y="42" class="small">bear case／反證</text>
    <line x1="1220" y1="34" x2="1275" y2="34" stroke="#51d88a" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <rect x="1290" width="150" height="68" rx="12" fill="#123b2a" stroke="#51d88a" stroke-width="2"/><text x="1315" y="42" class="t" font-size="21" font-weight="700">裁決</text>
  </g>

  <!-- Guardrails -->
  <text x="80" y="763" class="eyebrow" fill="#51d88a">安全護欄：研究與建議，永遠不等於執行</text>
  <g transform="translate(80 790)">
    <rect class="card" width="450" height="120" rx="14"/><rect width="8" height="120" rx="4" fill="#51d88a"/><text x="32" y="39" class="guardH">不自動下單</text><text x="32" y="70" class="guardB">顧問建議 ≠ 下單指令</text><text x="32" y="96" class="small">下單永遠由使用者完成。</text>
  </g>
  <g transform="translate(575 790)">
    <rect class="card" width="450" height="120" rx="14"/><rect width="8" height="120" rx="4" fill="#42a5ff"/><text x="32" y="39" class="guardH">帳本確認</text><text x="32" y="70" class="guardB">交易資訊 → 確認表 → 明確確認</text><text x="32" y="96" class="small">才 append ledger；transactions.csv 是唯一真相。</text>
  </g>
  <g transform="translate(1070 790)">
    <rect class="card" width="450" height="120" rx="14"/><rect width="8" height="120" rx="4" fill="#ffb74d"/><text x="32" y="39" class="guardH">成功靜默</text><text x="32" y="70" class="guardB">正常完成不打擾；只交付短文 + PDF</text><text x="32" y="96" class="small">只有 bug、阻塞、需決策或交付失敗才通知。</text>
  </g>
  <text x="80" y="962" class="tiny">研究與教育用途｜不構成投資建議｜系統不自動下單｜資料缺口會明確標示</text>
</svg>
