<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI 產業鏈週報：從原始證據到可行動的產業地圖</title><desc id="desc">AI 週報的研究、判斷、紅隊、定稿交付與長期記憶回饋流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf1f8"/></linearGradient>
    <marker id="ba" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#42a5ff"/></marker><marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ffb74d"/></marker><marker id="ra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff6363"/></marker><marker id="ga" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#51d88a"/></marker>
    <style>.t{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#14243a}.sub{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:24px;fill:#53657c}.tag{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:16px;font-weight:700;letter-spacing:1.4px}.h{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:25px;font-weight:700;fill:#14243a}.body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:17px;fill:#26384f}.small{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:15px;fill:#5b6f88}.card{fill:#ffffff;stroke:#c9d7e6;stroke-width:2}.label{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:14px;font-weight:700}</style>
  </defs>
  <style>
    rect[fill="#092d50"],rect[fill="#0b3158"]{fill:#e6f3ff} rect[fill="#443011"],rect[fill="#463011"]{fill:#fff2dc} rect[fill="#481923"]{fill:#ffeaec} rect[fill="#123b2a"]{fill:#e7f8ee} rect[fill="#0a1a2c"],rect[fill="#0c1c31"],rect[fill="#102942"]{fill:#ffffff}
    text[fill="#79c2ff"],text[fill="#83c7ff"],text[fill="#c5ddf6"]{fill:#176fae} text[fill="#ffd083"],text[fill="#ffca75"]{fill:#a66300} text[fill="#ffb0b4"],text[fill="#ffadad"]{fill:#b33142} text[fill="#84e8ad"],text[fill="#75e3a3"]{fill:#238e55}
  </style>
  <rect width="1600" height="1000" fill="url(#bg)"/><path d="M0 155H1600M0 915H1600" stroke="#ccd9e7" stroke-width="2"/>
  <text x="70" y="72" class="tag" fill="#42a5ff">WEEKLY INDUSTRY INTELLIGENCE / 02</text><text x="70" y="116" class="t" font-size="38" font-weight="700">AI 產業鏈週報：從原始證據到可行動的產業地圖</text><text x="70" y="148" class="sub">每週追蹤 AI 資本支出、供應鏈瓶頸、變現品質與估值風險；不是新聞摘要。</text>
  <text x="70" y="203" class="tag" fill="#aab9ce">四段式研究與決策流</text>
  <!-- cards -->
  <g transform="translate(70 230)"><rect class="card" width="335" height="445" rx="16"/><rect width="335" height="8" rx="4" fill="#42a5ff"/><text x="25" y="44" class="tag" fill="#6eb7ff">A｜研究員</text><text x="25" y="79" class="h">產業證據包</text><text x="25" y="114" class="body">先建立可驗證的產業事實</text><path d="M25 137H310" stroke="#284563"/>
    <text x="25" y="171" class="body">量化：價格、PE、市值、52 週位置</text><text x="25" y="198" class="body">VIX、利率、CapEx、1W / 1M / YTD</text><text x="25" y="240" class="body">一手：財報、法說會、IR、SEC/XBRL</text><text x="25" y="267" class="body">供應鏈與產業原始資料</text><text x="25" y="309" class="body">七題：CapEx · 變現 · HBM · 網路</text><text x="25" y="336" class="body">電力散熱 · 估值風報 · 來源品質</text><rect x="25" y="376" width="285" height="43" rx="8" fill="#092d50"/><text x="40" y="403" class="label" fill="#79c2ff">輸出｜Research Packet + report_data_inputs</text></g>
  <g transform="translate(440 230)"><rect class="card" width="335" height="445" rx="16"/><rect width="335" height="8" rx="4" fill="#ffb74d"/><text x="25" y="44" class="tag" fill="#ffca75">B｜主筆</text><text x="25" y="79" class="h">初稿判斷</text><text x="25" y="114" class="body">把事實轉成可被挑戰的論點</text><path d="M25 137H310" stroke="#284563"/>
    <text x="25" y="171" class="body">與上週比較：延續還是修正？</text><text x="25" y="212" class="body">Thesis 只因新事實／反證改變</text><text x="25" y="239" class="body">不因單週股價改變</text><text x="25" y="281" class="body">拆解熱度、瓶頸、變現與估值</text><text x="25" y="322" class="body">每個結論：bear case + 推翻條件</text><rect x="25" y="376" width="285" height="43" rx="8" fill="#443011"/><text x="40" y="403" class="label" fill="#ffd083">輸出｜不交付的判斷草稿</text></g>
  <g transform="translate(810 230)"><rect class="card" width="335" height="445" rx="16"/><rect width="335" height="8" rx="4" fill="#ff6363"/><text x="25" y="44" class="tag" fill="#ffadad">C｜紅隊</text><text x="25" y="79" class="h">空頭紅隊</text><text x="25" y="114" class="body">先獨立思考，再攻擊草稿</text><path d="M25 137H310" stroke="#284563"/>
    <text x="25" y="171" class="body">先寫 3–5 條獨立空頭觀點</text><text x="25" y="212" class="body">結論是否過度樂觀？</text><text x="25" y="253" class="body">是否忽略反證來維持舊觀點？</text><text x="25" y="294" class="body">候選是否被新聞熱度驅動？</text><text x="25" y="335" class="body">預測市場／期貨是否矛盾？</text><rect x="25" y="376" width="285" height="43" rx="8" fill="#481923"/><text x="40" y="403" class="label" fill="#ffb0b4">輸出｜同意／保留／反對 + 理由</text></g>
  <g transform="translate(1180 230)"><rect class="card" width="350" height="445" rx="16"/><rect width="350" height="8" rx="4" fill="#51d88a"/><text x="25" y="44" class="tag" fill="#75e3a3">D｜主筆</text><text x="25" y="79" class="h">定稿、知識庫、交付</text><text x="25" y="114" class="body">回應挑戰後才定稿</text><path d="M25 137H325" stroke="#284563"/>
    <text x="25" y="171" class="body">採納紅隊並修改，或以證據反駁</text><text x="25" y="212" class="body">report-data.json → 圖表 → PDF</text><text x="25" y="253" class="body">Markdown／Archive PDF → 趨勢 Wiki</text><text x="25" y="294" class="body">本地輸出短版摘要</text><rect x="25" y="376" width="300" height="43" rx="8" fill="#123b2a"/><text x="40" y="403" class="label" fill="#84e8ad">交付｜短文總結 + Dashboard PDF</text></g>
  <!-- arrows -->
  <path d="M407 452H431" stroke="#ffb74d" stroke-width="4" marker-end="url(#aa)"/><text x="394" y="438" class="label" fill="#ffca75">判斷</text><path d="M777 452H801" stroke="#ff6363" stroke-width="4" marker-end="url(#ra)"/><text x="763" y="438" class="label" fill="#ffadad">反駁</text><path d="M1147 452H1171" stroke="#51d88a" stroke-width="4" marker-end="url(#ga)"/><text x="1131" y="438" class="label" fill="#75e3a3">回應</text>
  <!-- lower panels -->
  <g transform="translate(70 720)"><rect width="1000" height="130" rx="14" fill="#0a1a2c" stroke="#274361" stroke-width="2"/><text x="25" y="33" class="tag" fill="#42a5ff">長期記憶迴路</text><rect x="25" y="52" width="215" height="45" rx="8" fill="#0b3158"/><text x="42" y="81" class="label" fill="#83c7ff">最終報告／Archive PDF</text><path d="M250 75H347" stroke="#42a5ff" stroke-width="3" marker-end="url(#ba)"/><rect x="360" y="52" width="230" height="45" rx="8" fill="#102942"/><text x="385" y="81" class="label" fill="#c5ddf6">trends Wiki / current-state</text><path d="M600 75H697" stroke="#42a5ff" stroke-width="3" marker-end="url(#ba)"/><rect x="710" y="52" width="260" height="45" rx="8" fill="#0b3158"/><text x="736" y="81" class="label" fill="#83c7ff">下一週研究員</text></g>
  <g transform="translate(1100 720)"><rect width="430" height="130" rx="14" fill="#0c1c31" stroke="#ffb74d" stroke-width="2"/><text x="25" y="33" class="tag" fill="#ffca75">這份報告回答什麼？</text><text x="25" y="62" class="small">CapEx 是否擴張？瓶頸在哪？</text><text x="25" y="87" class="small">變現或敘事先行？哪些只剩高估值？</text><text x="25" y="112" class="small">哪些新資料足以改變長期論點？</text></g>
  <text x="70" y="962" class="small">研究與教育用途｜不構成投資建議｜系統不自動下單｜資料缺口會明確標示</text>
</svg>
